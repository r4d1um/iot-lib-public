sentence=Driver for HD44780 character LCDs (16x2, 20x4, 40x4) over a PCF8574 I2C backpack or 4-bit parallel pins.
paragraph=print() takes UTF-8 (umlauts, degree sign) and maps it to the character ROM; a screen buffer with text fields and bar graphs sends only changed cells. Precompiled core for ESP8266, ESP32 and AVR; LiquidCrystal-style API, works with LcdSplash.
category=Display
