# cpp/shift595: test, build the core once for all targets and publish it as release
# cpp/shift595/v<VERSION>. A new release is only created when the version
# in library.properties was bumped (tags come from this workflow, never by hand).
# Runs only when the library, this workflow or the toolchains change.
name: cpp/shift595

on:
  push:
    branches: [main]
    paths: ['cpp/shift595/**', '.github/workflows/cpp-shift595.yml', 'tools/session-setup.sh', 'tools/mk/**']
  pull_request:
    paths: ['cpp/shift595/**', '.github/workflows/cpp-shift595.yml', 'tools/session-setup.sh', 'tools/mk/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpp-shift595-${{ github.ref }}
  # PRs: cancel the previous run; main: never cancel in the middle of a release
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # only for the release step
    defaults:
      run:
        working-directory: cpp/shift595
    steps:
      - uses: actions/checkout@v6

      # toolchains from r4d1um/setup: download once, then from the cache
      - uses: actions/cache@v5
        with:
          path: ~/.local/share/r4setup
          key: r4setup-shift595-${{ hashFiles('tools/session-setup.sh') }}

      - name: Toolchains
        working-directory: .
        run: tools/session-setup.sh xtensa-lx106-elf xtensa-esp32-elf avr-gcc arduino-cli arduino-avr

      # make test (ASan/UBSan, fake 74HC595 chain) -> all targets -> packages -> real Uno firmware against the zip
      - name: Tests, all targets, packages, firmware
        run: make -j"$(nproc)" firmware-check

      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(make -s print-version)
          tag="cpp/shift595/v$v"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists - version not bumped, nothing to do" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # this version's CHANGELOG section as release notes
          awk -v v="## $v" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > build/notes.md
          gh release create "$tag" build/pkg/* --target "$GITHUB_SHA" --title "Shift595 $v" --notes-file build/notes.md
          echo "Release $tag published" >> "$GITHUB_STEP_SUMMARY"
