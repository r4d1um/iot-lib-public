# cpp/shift595: test, build the core once for all targets and publish it as release
# cpp/shift595/v<VERSION>. A new release is only created when the version
# in library.properties was bumped (tags come from this workflow, never by hand).
# Runs only when the library, this workflow or the toolchains change.
name: cpp/shift595

on:
  push:
    branches: [main]
    paths: ['cpp/shift595/**', '.github/workflows/cpp-shift595.yml', 'tools/toolchains.sh', 'tools/mk/**']
  pull_request:
    paths: ['cpp/shift595/**', '.github/workflows/cpp-shift595.yml', 'tools/toolchains.sh', 'tools/mk/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpp-shift595-${{ github.ref }}
  # PRs: cancel the previous run; main: never cancel in the middle of a release
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # only for the release step
    defaults:
      run:
        working-directory: cpp/shift595
    steps:
      - uses: actions/checkout@v6

      # ESP cross compilers (those of Arduino ESP8266 core 3.1.2 / ESP32 core 2.0.17) from their
      # upstream releases, SHA-256 pinned in tools/toolchains.sh; one cache shared by all workflows
      - uses: actions/cache@v5
        with:
          path: ~/.cache/iot-lib-public/toolchains
          key: toolchains-${{ hashFiles('tools/toolchains.sh') }}

      - name: ESP toolchains
        working-directory: .
        run: tools/toolchains.sh

      # AVR: Ubuntu's gcc-avr 7.3 (same GCC as Arduino AVR core 1.8.6), cached; no postinst needed.
      # Bump "version" to force a fresh install.
      - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: gcc-avr avr-libc binutils-avr
          version: "1"

      # arduino-cli + Arduino AVR core for the real Uno firmware (firmware-check)
      - uses: arduino/setup-arduino-cli@v2   # Node 24
        with:
          version: 1.x
          token: ${{ github.token }}
      - uses: actions/cache@v5
        with:
          path: ~/.arduino15
          key: arduino15-avr-1.8.6
      - name: Arduino AVR core
        working-directory: .
        run: arduino-cli core list | grep -q '^arduino:avr  *1\.8\.6 ' || { arduino-cli core update-index && arduino-cli core install arduino:avr@1.8.6; }

      - name: Toolchain versions
        working-directory: .
        run: |
          for c in gcc xtensa-lx106-elf-gcc xtensa-esp32-elf-gcc avr-gcc; do
            printf '%-24s %s\n' "$c" "$($c --version | head -1)" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      # make test (ASan/UBSan, fake 74HC595 chain) -> all targets -> packages -> real Uno firmware against the zip
      - name: Tests, all targets, packages, firmware
        run: make -j"$(nproc)" firmware-check

      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(make -s print-version)
          tag="cpp/shift595/v$v"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists - version not bumped, nothing to do" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # this version's CHANGELOG section as release notes
          awk -v v="## $v" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > build/notes.md
          gh release create "$tag" build/pkg/* --target "$GITHUB_SHA" --title "Shift595 $v" --notes-file build/notes.md
          echo "Release $tag published" >> "$GITHUB_STEP_SUMMARY"
