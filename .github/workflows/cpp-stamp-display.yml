# cpp/stamp-display: test, build the core once for all targets and publish it as release
# cpp/stamp-display/v<VERSION>. A new release is only created when the version
# in library.properties was bumped (tags come from this workflow, never by hand).
# Runs only when the library, this workflow or the toolchains change.
name: cpp/stamp-display

on:
  push:
    branches: [main]
    paths: ['cpp/stamp-display/**', '.github/workflows/cpp-stamp-display.yml', 'tools/toolchains.sh', 'tools/mk/**']
  pull_request:
    paths: ['cpp/stamp-display/**', '.github/workflows/cpp-stamp-display.yml', 'tools/toolchains.sh', 'tools/mk/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpp-stamp-display-${{ github.ref }}
  # PRs: cancel the previous run; main: never cancel in the middle of a release
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write   # only for the release step
    defaults:
      run:
        working-directory: cpp/stamp-display
    steps:
      - uses: actions/checkout@v6

      # ESP cross compilers (those of Arduino ESP8266 core 3.1.2 / ESP32 core 2.0.17) from their
      # upstream releases, SHA-256 pinned in tools/toolchains.sh; one cache shared by all workflows
      - uses: actions/cache@v5
        with:
          path: ~/.cache/iot-lib-public/toolchains
          key: toolchains-${{ hashFiles('tools/toolchains.sh') }}

      - name: ESP toolchains
        working-directory: .
        run: tools/toolchains.sh

      - name: Toolchain versions
        working-directory: .
        run: |
          for c in gcc xtensa-lx106-elf-gcc xtensa-esp32-elf-gcc; do
            printf '%-24s %s\n' "$c" "$($c --version | head -1)" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Tests, all targets, packages
        run: make -j"$(nproc)" package

      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(make -s print-version)
          tag="cpp/stamp-display/v$v"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists - version not bumped, nothing to do" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # this version's CHANGELOG section as release notes
          awk -v v="## $v" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > build/notes.md
          gh release create "$tag" build/pkg/* --target "$GITHUB_SHA" --title "StampDisplay $v" --notes-file build/notes.md
          echo "Release $tag published" >> "$GITHUB_STEP_SUMMARY"
