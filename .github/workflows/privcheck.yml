# Mandatory check for this public repo: no private IPs, home-network
# hostnames, e-mail addresses or credentials in any file.
name: privcheck

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: privcheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false   # no dependencies
      - run: go vet ./... && go test ./...
      - run: go run ./tools/privcheck .
